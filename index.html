<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F5F6F3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#11181F" media="(prefers-color-scheme: dark)">
  <title>METRO Team Board</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2322384F'/%3E%3Cpath d='M9 22V10l7 7 7-7v12' fill='none' stroke='%23fff' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="config.js" defer></script>
  <script src="js/core.js" defer></script>
  <script src="js/data.js" defer></script>
  <script src="js/views.js" defer></script>
  <script src="js/app.js" defer></script>
  <style>
    /* 오늘/주간 타임라인 뷰 — 기존 데이터 로딩 로직은 그대로 사용합니다. */
    .gantt-scroll,.week-matrix-wrap{overflow:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line,#dfe4e7);border-radius:14px;background:var(--surface,#fff)}
    .gantt-chart{min-width:860px}
    .gantt-head,.gantt-person{display:grid;grid-template-columns:118px minmax(700px,1fr)}
    .gantt-head{position:sticky;top:0;z-index:4;background:var(--surface,#fff);border-bottom:1px solid var(--line,#dfe4e7)}
    .gantt-corner,.gantt-person__meta{position:sticky;left:0;z-index:3;background:var(--surface,#fff);border-right:1px solid var(--line,#dfe4e7)}
    .gantt-corner{padding:12px 14px;font-size:12px;font-weight:700;color:var(--muted,#687680)}
    .gantt-hours{position:relative;height:42px;background:repeating-linear-gradient(to right,transparent 0,transparent calc(4.1667% - 1px),var(--line,#e7ebed) calc(4.1667% - 1px),var(--line,#e7ebed) 4.1667%)}
    .gantt-hour{position:absolute;top:12px;transform:translateX(-50%);font-size:11px;color:var(--muted,#687680)}
    .gantt-hour:first-child{transform:none}.gantt-hour:last-child{transform:translateX(-100%)}
    .gantt-person{min-height:56px;border-bottom:1px solid var(--line,#edf0f2)}
    .gantt-person:last-child{border-bottom:0}
    .gantt-person__meta{padding:9px 12px;display:flex;flex-direction:column;justify-content:center;gap:2px}
    .gantt-person__name{font-size:14px;font-weight:800;color:var(--text,#17232c)}
    .gantt-person__team{font-size:11px;color:var(--muted,#687680)}
    .gantt-track{position:relative;margin:7px 0;min-height:42px;background:repeating-linear-gradient(to right,transparent 0,transparent calc(4.1667% - 1px),var(--line,#edf0f2) calc(4.1667% - 1px),var(--line,#edf0f2) 4.1667%)}
    .gantt-bar{position:absolute;top:5px;left:var(--start);width:var(--length);min-width:28px;height:32px;padding:0 10px;border-radius:8px;display:flex;align-items:center;overflow:hidden;white-space:nowrap;font-size:12px;font-weight:800;color:#153b2b;background:#7fdcaf;box-shadow:inset 0 0 0 1px rgba(23,106,71,.08)}
    .gantt-bar.is-now{background:#43c98a;color:#083923}
    .gantt-now-line{position:absolute;inset:0 auto 0 var(--now);width:2px;background:#20b977;z-index:2;pointer-events:none;opacity:.8}
    .gantt-legend{display:flex;gap:14px;flex-wrap:wrap;margin:10px 2px 0;font-size:12px;color:var(--muted,#687680)}
    .gantt-legend i{display:inline-block;width:10px;height:10px;margin-right:5px;border-radius:3px;vertical-align:-1px}
    .week-matrix{border-collapse:separate;border-spacing:0;min-width:920px;width:100%;font-size:12px}
    .week-matrix th,.week-matrix td{padding:9px 10px;border-right:1px solid var(--line,#dfe4e7);border-bottom:1px solid var(--line,#dfe4e7);vertical-align:middle;text-align:center}
    .week-matrix tr:last-child td{border-bottom:0}.week-matrix th:last-child,.week-matrix td:last-child{border-right:0}
    .week-matrix thead th{position:sticky;top:0;z-index:4;background:var(--surface-2,#f3f6f6);font-weight:800}
    .week-matrix .member-col{position:sticky;left:0;z-index:3;width:122px;min-width:122px;text-align:left;background:var(--surface,#fff)}
    .week-matrix thead .member-col{z-index:5;background:var(--surface-2,#f3f6f6)}
    .week-member{display:block;font-size:13px;font-weight:800;color:var(--text,#17232c)}
    .week-team{display:block;margin-top:2px;font-size:10px;font-weight:500;color:var(--muted,#687680)}
    .week-day{display:block;font-size:13px}.week-date{display:block;margin-top:2px;font-size:10px;color:var(--muted,#687680)}
    .week-cell{min-width:102px;background:var(--surface,#fff)}
    .week-pill{display:block;margin:2px auto;padding:5px 6px;border-radius:6px;background:#daf5e7;color:#126a43;font-size:11px;font-weight:800;white-space:nowrap}
    .week-pill--leave{background:#f5e3bd;color:#77510c}.week-pill--miss{background:transparent;color:var(--muted,#849097)}
    .week-pill--off{background:#eef1f2;color:#68747b}.week-pill--check{background:#e7eef9;color:#46658c}
    .week-today{background:color-mix(in srgb,var(--ok,#2bb978) 8%,var(--surface,#fff))!important}
    @media(max-width:720px){
      .gantt-chart{min-width:760px}.gantt-head,.gantt-person{grid-template-columns:96px minmax(640px,1fr)}
      .gantt-person__meta{padding-left:10px}.week-matrix{min-width:820px}
      .gantt-scroll,.week-matrix-wrap{margin-inline:-4px;border-radius:12px}
    }
  </style>
</head>
<body>
  <!-- 아이콘 모음 -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-today" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
    <symbol id="i-week" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16M15 4v16"/></symbol>
    <symbol id="i-month" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M8 14h.01M12 14h.01M16 14h.01M8 17.5h.01M12 17.5h.01"/></symbol>
    <symbol id="i-meet" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></symbol>
    <symbol id="i-team" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36L21 8"/><path d="M21 3v5h-5"/></symbol>
    <symbol id="i-left" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></symbol>
    <symbol id="i-ok" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><path d="M8 12.3l2.8 2.8L16.2 9.5"/></symbol>
    <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><path d="M9.3 9.2a2.8 2.8 0 0 1 5.4 1c0 1.9-2.8 2.6-2.8 2.6M12 16.8h.01"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><path d="M10 15V9M14 15V9"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><path d="M12 7.5v5M12 16.5h.01"/></symbol>
    <symbol id="i-leave" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M10 14l4 4M14 14l-4 4"/></symbol>
    <symbol id="i-flag" viewBox="0 0 24 24"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="M14 4h6v6M10 14L20 4M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/></symbol>
    <symbol id="i-cal-plus" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M12 13.5v5M9.5 16h5"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><path d="M12 11v5M12 7.5h.01"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-logo" viewBox="0 0 24 24"><path d="M6 18V6l6 6 6-6v12"/></symbol>
  </svg>

  <a class="skip" href="#main">본문으로 건너뛰기</a>

  <div class="app">
    <header class="hdr">
      <div class="hdr__brand"><span class="hdr__mark"><svg class="ic" aria-hidden="true"><use href="#i-logo"/></svg></span><span id="brandName">METRO Team Board</span></div>
      <div class="hdr__meta">
        <span class="hdr__date" id="hdrDate"></span>
        <span class="sync is-loading" id="hdrSync" aria-live="polite">불러오는 중</span>
      </div>
      <button class="iconbtn" type="button" id="refreshBtn" aria-label="데이터 새로고침"><svg class="ic" aria-hidden="true"><use href="#i-refresh"/></svg></button>
    </header>

    <aside class="side">
      <nav class="nav" aria-label="주요 메뉴">
        <a href="#today" data-view="today"><span class="nav__ic"><svg class="ic" aria-hidden="true"><use href="#i-today"/></svg></span><span>오늘</span></a>
        <a href="#week" data-view="week"><span class="nav__ic"><svg class="ic" aria-hidden="true"><use href="#i-week"/></svg></span><span>주간</span></a>
        <a href="#month" data-view="month"><span class="nav__ic"><svg class="ic" aria-hidden="true"><use href="#i-month"/></svg></span><span>월간</span></a>
        <a href="#meet" data-view="meet"><span class="nav__ic"><svg class="ic" aria-hidden="true"><use href="#i-meet"/></svg></span><span>회의</span></a>
        <a href="#team" data-view="team"><span class="nav__ic"><svg class="ic" aria-hidden="true"><use href="#i-team"/></svg></span><span class="lbl-short">팀</span><span class="lbl-long">팀 명단</span></a>
      </nav>
      <div class="side__links" id="sideLinks"></div>
    </aside>

    <div class="main">
      <div class="alert" id="alert" role="alert" hidden></div>
      <main id="main" tabindex="-1">
        <section class="view" id="v-today" aria-label="오늘"></section>
        <section class="view" id="v-week" aria-label="주간" hidden></section>
        <section class="view" id="v-month" aria-label="월간" hidden></section>
        <section class="view" id="v-meet" aria-label="회의" hidden></section>
        <section class="view" id="v-team" aria-label="팀 명단" hidden></section>
      </main>
    </div>
  </div>

  <noscript><p style="padding:16px">이 페이지는 자바스크립트가 켜져 있어야 보여요.</p></noscript>
  <script>
  window.addEventListener('DOMContentLoaded', () => {
    const esc = value => String(value ?? '').replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
    const parseRange = text => {
      const m = String(text).match(/(\d{1,2})(?::(\d{2}))?\s*[–-]\s*(\d{1,2})(?::(\d{2}))?/);
      if (!m) return null;
      return {start:+m[1]+(+(m[2]||0)/60),end:+m[3]+(+(m[4]||0)/60),label:text.trim()};
    };
    const rowData = row => ({
      name:row.querySelector('.row__name')?.textContent.trim() || '',
      team:row.querySelector('.row__team')?.textContent.trim() || '',
      ranges:[...row.querySelectorAll('.row__side > span')].map(x=>parseRange(x.textContent)).filter(Boolean),
      now:!!row.querySelector('.tag--now')
    });
    let busy = false;

    function makeTodayGantt(){
      const root=document.querySelector('#v-today');
      if(!root || root.querySelector('.gantt-chart')) return;
      const title=root.querySelector('#s-avail');
      const sec=title?.closest('.sec');
      const panel=sec?.querySelector('.panel');
      if(!panel) return;
      const people=[...panel.querySelectorAll(':scope > .rows > li .row')].map(rowData).filter(x=>x.name&&x.ranges.length);
      if(!people.length) return;
      const now=new Date().getHours()+new Date().getMinutes()/60;
      const hourMarks=Array.from({length:9},(_,i)=>i*3);
      panel.classList.remove('panel');
      panel.innerHTML=`<div class="gantt-scroll"><div class="gantt-chart">
        <div class="gantt-head"><div class="gantt-corner">이름 / 팀</div><div class="gantt-hours">${hourMarks.map(h=>`<span class="gantt-hour" style="left:${h/24*100}%">${h}</span>`).join('')}</div></div>
        ${people.map(p=>`<div class="gantt-person"><div class="gantt-person__meta"><span class="gantt-person__name">${esc(p.name)}</span><span class="gantt-person__team">${esc(p.team)}</span></div><div class="gantt-track"><i class="gantt-now-line" style="--now:${now/24*100}%"></i>${p.ranges.map(r=>`<span class="gantt-bar${p.now&&now>=r.start&&now<=r.end?' is-now':''}" style="--start:${r.start/24*100}%;--length:${Math.max(.5,r.end-r.start)/24*100}%">${esc(r.label.replace(/:00/g,''))}</span>`).join('')}</div></div>`).join('')}
      </div></div><div class="gantt-legend"><span><i style="background:#43c98a"></i>현재 작업 가능</span><span><i style="background:#7fdcaf"></i>오늘 작업 가능</span></div>`;
      sec.querySelector('.sec__note')?.replaceChildren(document.createTextNode('가로로 밀어 전체 시간 보기'));
    }

    function namesFromGroup(id){
      const group=document.querySelector(id);
      return [...(group?.querySelectorAll('.names li')||[])].map(li=>({name:li.childNodes[0]?.textContent.trim()||'',team:li.querySelector('small')?.textContent.trim()||''}));
    }
    function makeWeekMatrix(){
      const root=document.querySelector('#v-week');
      if(!root || root.querySelector('.week-matrix')) return;
      const cols=[...root.querySelectorAll('.wcols > .wcol')];
      const oldStrip=root.querySelector('.strip');
      const oldCols=root.querySelector('.wcols');
      if(cols.length!==7 || !oldCols) return;
      const missing=namesFromGroup('#g-nosubmit'), checking=namesFromGroup('#g-check');
      const missSet=new Set(missing.map(x=>x.name)), checkSet=new Set(checking.map(x=>x.name));
      const members=new Map();
      const days=cols.map((col,idx)=>{
        const head=col.querySelector('.wcol__head h3')?.textContent.replace('오늘','').trim()||`요일 ${idx+1}`;
        const avail=new Map(), leave=new Set();
        [...col.querySelectorAll(':scope > .rows > li .row')].forEach(row=>{const d=rowData(row);avail.set(d.name,d);members.set(d.name,d.team)});
        [...col.querySelectorAll('.wcol__part.tone-leave .row')].forEach(row=>{const d=rowData(row);leave.add(d.name);members.set(d.name,d.team)});
        return {head,avail,leave,today:col.classList.contains('is-today')};
      });
      [...missing,...checking].forEach(x=>{if(x.name&&!members.has(x.name))members.set(x.name,x.team)});
      const order=[...members.keys()];
      const cell=(name,day)=>{
        const d=day.avail.get(name);
        if(d) return d.ranges.map(r=>`<span class="week-pill">${esc(r.label.replace(/:00/g,''))}</span>`).join('');
        if(day.leave.has(name)) return '<span class="week-pill week-pill--leave">휴가·일정</span>';
        if(missSet.has(name)) return '<span class="week-pill week-pill--miss">미입력</span>';
        if(checkSet.has(name)) return '<span class="week-pill week-pill--check">일정별 확인</span>';
        return '<span class="week-pill week-pill--off">휴무</span>';
      };
      const wrap=document.createElement('div');wrap.className='week-matrix-wrap';
      wrap.innerHTML=`<table class="week-matrix"><thead><tr><th class="member-col">이름</th>${days.map(d=>{const parts=d.head.split(/\s+/);return `<th class="${d.today?'week-today':''}"><span class="week-day">${esc(parts[0])}</span><span class="week-date">${esc(parts.slice(1).join(' '))}</span></th>`}).join('')}</tr></thead><tbody>${order.map(name=>`<tr><td class="member-col"><span class="week-member">${esc(name)}</span><span class="week-team">${esc(members.get(name))}</span></td>${days.map(d=>`<td class="week-cell ${d.today?'week-today':''}">${cell(name,d)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
      oldStrip?.remove();oldCols.replaceWith(wrap);
    }
    function enhance(){if(busy)return;busy=true;try{makeTodayGantt();makeWeekMatrix();}finally{busy=false}}
    const observer=new MutationObserver(()=>requestAnimationFrame(enhance));
    observer.observe(document.querySelector('#main'),{childList:true,subtree:true});
    enhance();
  });
  </script>
</body>
</html>
