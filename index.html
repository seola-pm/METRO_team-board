<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7efe4">
  <title>METRO Team Board</title>
  <meta name="description" content="METRO 팀 작업 가능 시간과 회의를 한곳에서 확인합니다.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23755447'/%3E%3Cpath d='M8 23V9l8 8 8-8v14' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a class="brand" href="#today" aria-label="오늘 화면"><span class="brand-mark">M</span><span>METRO Team Board</span></a>
      <div class="sync"><span id="todayLabel"></span><button id="refreshBtn" type="button">새로고침</button></div>
    </header>
    <aside class="sidebar">
      <nav id="nav" aria-label="주요 메뉴">
        <a href="#today" data-view="today">오늘</a><a href="#week" data-view="week">이번 주</a><a href="#month" data-view="month">이번 달</a><a href="#meet" data-view="meet">회의</a><a href="#team" data-view="team">팀 명단</a><a href="#links" data-view="links">링크 허브</a>
      </nav>
    </aside>
    <main id="main">
      <div id="notice" class="notice" hidden></div>
      <section id="today" class="view"></section>
      <section id="week" class="view" hidden></section>
      <section id="month" class="view" hidden></section>
      <section id="meet" class="view" hidden></section>
      <section id="team" class="view" hidden></section>
      <section id="links" class="view" hidden></section>
    </main>
  </div>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
